
# Umbriel - Desktop configuration
#
# General
[general]
autostart = ["noctalia"]
xwayland = true
xwayland_xsettings = true
attach_modal_dialogs = true

# Appearance
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# Title bar
[appearance.title_bar]
mode = "forced"
height = 30
font = "sans 10"
button_position = "right"
buttons = ["minimize", "maximize", "close"]
button_gap = 8
button_glyph = "hover"
button_background = true

# Layout
[layout]
mode = "scrolling"
gap = 8
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# Input
[input.keyboard]
numlock_toggle = true
